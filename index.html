html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
input,select,textarea{font:inherit;color:inherit}
.app{display:flex;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}

/* ---------- sidebar ---------- */
.side{width:270px;flex:0 0 270px;background:var(--side);display:flex;flex-direction:column;border-right:1px solid var(--line);transition:margin .2s}
.app.side-hidden .side{margin-left:-270px}
.side-top{display:flex;align-items:center;gap:6px;padding:10px 10px 6px}
.side-top .grow{flex:1}
.ibtn{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.ibtn:hover{background:var(--hover);color:var(--ink)}
.ibtn svg{width:20px;height:20px}
.newchat{display:flex;align-items:center;gap:10px;margin:2px 8px 6px;padding:9px 10px;border-radius:10px;font-weight:500}
.newchat:hover{background:var(--hover)}
.search{margin:0 8px 8px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);width:calc(100% - 16px);font-size:14px}
.list{flex:1;overflow-y:auto;padding:0 6px 10px;-webkit-overflow-scrolling:touch}
.group{font-size:12px;color:var(--muted);padding:12px 10px 4px;font-weight:600}
.item{display:flex;align-items:center;border-radius:10px;position:relative}
.item:hover,.item.active{background:var(--hover)}
.item .t{flex:1;padding:8px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px;text-align:left}
.item .pin{font-size:11px;margin-left:-4px;opacity:.6}
.item .dots{width:30px;height:30px;border-radius:8px;opacity:.55;flex:0 0 30px}
.item .dots:hover{opacity:1;background:var(--line)}
.item input{flex:1;margin:4px;padding:5px 8px;border-radius:8px;border:1px solid var(--accent);background:var(--bg);font-size:14px}
.side-bottom{border-top:1px solid var(--line);padding:8px}
.side-bottom button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;font-size:14.5px}
.side-bottom button:hover{background:var(--hover)}
.menu{position:fixed;z-index:50;background:var(--pill);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:170px}
.menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:8px;font-size:14.5px}
.menu button:hover{background:var(--hover)}
.menu .danger{color:var(--err)}
.scrim{display:none}

/* ---------- main ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.top{display:flex;align-items:center;gap:4px;padding:8px 10px;min-height:54px}
.top .grow{flex:1}
.modelpick{position:relative;display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:10px;font-weight:600;font-size:17px;max-width:60vw}
.modelpick:hover{background:var(--hover)}
.modelpick span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modelpick select{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.app:not(.side-hidden) .top .when-hidden{display:none}

.scroller{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.thread{max-width:780px;margin:0 auto;padding:12px 18px 24px}
.msg{margin:0 0 22px}
.msg.user{display:flex;flex-direction:column;align-items:flex-end}
.msg.user .bubble{background:var(--userbg);border-radius:22px;padding:10px 16px;max-width:80%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.assistant .bubble{overflow-wrap:anywhere}
.msg.error .bubble{color:var(--err);border:1px solid var(--err);border-radius:12px;padding:10px 14px;font-size:14px}
.atts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-bottom:6px;max-width:80%}
.atts img{max-width:200px;max-height:200px;border-radius:14px;display:block;object-fit:cover}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:13.5px;background:var(--bg);max-width:240px}
.chip .ic{width:30px;height:30px;border-radius:8px;background:#e8453c;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 30px}
.chip .ic.doc{background:#2b6be8}.chip .ic.xls{background:#1f8f4e}.chip .ic.txt{background:#7a7a7a}
.chip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .sz{color:var(--muted);font-size:12px}
.bubble pre{background:var(--side);border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto;font-size:13.5px}
.bubble code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em}
.bubble :not(pre)>code{background:var(--userbg);padding:1px 5px;border-radius:5px}
.bubble p{margin:.5em 0}.bubble ul,.bubble ol{padding-left:1.4em}
.bubble table{border-collapse:collapse;display:block;overflow-x:auto}.bubble td,.bubble th{border:1px solid var(--line);padding:5px 9px}
.bubble img{max-width:100%}
.actions{display:flex;gap:2px;margin-top:2px}
.actions button{width:32px;height:32px;border-radius:8px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.actions button:hover{background:var(--hover);color:var(--ink)}
.actions svg{width:17px;height:17px}
.cursor{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ink);animation:blink 1s infinite;vertical-align:middle}
@keyframes blink{50%{opacity:.25}}
.hello{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:52vh;text-align:center;padding:0 20px}
.hello h1{font-size:28px;font-weight:600;margin:0 0 8px}
.hello p{color:var(--muted);margin:0}

/* ---------- composer ---------- */
.composer-wrap{padding:6px 14px calc(10px + env(safe-area-inset-bottom))}
.pill{max-width:780px;margin:0 auto;background:var(--pill);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:8px 8px 8px 8px}
.pending{display:flex;gap:8px;flex-wrap:wrap;padding:4px 6px 8px}
.pending .p{position:relative}
.pending img{width:60px;height:60px;border-radius:12px;object-fit:cover;display:block;border:1px solid var(--line)}
.pending .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px;line-height:22px;text-align:center}
.pending .busy{opacity:.5}
.row{display:flex;align-items:flex-end;gap:6px}
.row textarea{flex:1;resize:none;border:none;outline:none;background:transparent;padding:9px 6px;max-height:40vh;min-height:42px;line-height:1.45}
.cbtn{width:40px;height:40px;flex:0 0 40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.cbtn:hover{background:var(--hover)}
.cbtn svg{width:22px;height:22px}
.send{background:var(--accent);color:var(--onaccent)}
.send:hover{background:var(--accent);opacity:.85}
.send:disabled{opacity:.25}
.foot{text-align:center;font-size:11.5px;color:var(--muted);margin-top:6px}

.gen{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0}
.gen img{max-width:min(100%,420px);border-radius:16px;display:block;cursor:zoom-in;border:1px solid var(--line)}
.shimmer{width:min(100%,360px);aspect-ratio:1;border-radius:16px;background:linear-gradient(110deg,var(--userbg) 30%,var(--hover) 50%,var(--userbg) 70%);background-size:200% 100%;animation:sh 1.4s linear infinite;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
@keyframes sh{to{background-position:-200% 0}}
.modebar{display:flex;align-items:center;gap:6px;padding:2px 6px 6px}
.modechip{display:flex;align-items:center;gap:6px;background:#e7f0ff;color:#1f5fd6;border-radius:999px;padding:5px 10px;font-size:13.5px;font-weight:500}
@media (prefers-color-scheme: dark){ .modechip{background:#1d2c45;color:#8db4ff} }
.modechip button{font-size:12px;opacity:.8}
.sizesel{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 8px;font-size:13px}
.cbtn.on{background:#e7f0ff;color:#1f5fd6}
.viewer{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
.viewer.open{display:flex}
.viewer img{max-width:100%;max-height:78dvh;border-radius:10px}
.viewer .vb{display:flex;gap:10px}
.viewer .vb button{background:#fff;color:#111;border-radius:999px;padding:10px 18px;font-weight:600}
.viewer .vb .ghost{background:transparent;color:#fff;border:1px solid #666}
.viewer p{color:#bbb;font-size:13px;margin:0}

/* ---------- mobile ---------- */
@media (max-width: 899px){
  .side{position:fixed;z-index:30;top:0;bottom:0;left:0;padding-top:env(safe-area-inset-top);box-shadow:var(--shadow);margin-left:0}
  .app.side-hidden .side{margin-left:-290px}
  .app:not(.side-hidden) .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
  .app:not(.side-hidden) .top .when-hidden{display:flex}
  .thread{padding:10px 14px 20px}
}

/* ---------- settings sheet ---------- */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.sheet.open{display:flex}
.card{background:var(--bg);width:100%;max-width:520px;border-radius:20px;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:90dvh;overflow-y:auto;box-shadow:var(--shadow)}
.card h2{margin:0 0 6px;font-size:20px}
.card label{display:block;font-size:13px;color:var(--muted);margin:14px 0 5px}
.card input,.card select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--side)}
.inl{display:flex;gap:8px}.inl>*:first-child{flex:1}
.btn2{border:1px solid var(--line);border-radius:12px;padding:10px 14px;white-space:nowrap}
.status{font-size:13px;margin-top:6px;min-height:1.2em}.status.ok{color:var(--ok)}.status.err{color:var(--err)}
.btns{display:flex;gap:10px;margin-top:20px}
.btns button{flex:1;padding:12px;border-radius:12px;font-weight:600}
.primary{background:var(--accent);color:var(--onaccent)}
.secondary{border:1px solid var(--line)}
.hint{font-size:12.5px;color:var(--muted);margin-top:14px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* ---------- voice ---------- */
.voice{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}
.voice.open{display:flex}
.orb{width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bcd4ff,#4b7bec 55%,#1e3c9a);transition:transform .25s}
.orb.listening{animation:pulse 1.4s infinite}
.orb.thinking{animation:spin 1.2s linear infinite;background:conic-gradient(#4b7bec,#bcd4ff,#4b7bec)}
.orb.speaking{animation:talk .5s ease-in-out infinite alternate}
.orb.idle{opacity:.5}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(75,123,236,.45)}70%{box-shadow:0 0 0 34px rgba(75,123,236,0)}100%{box-shadow:0 0 0 0 rgba(75,123,236,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes talk{from{transform:scale(.94)}to{transform:scale(1.06)}}
.vstatus{font-size:19px;font-weight:600}
.vtext{color:var(--muted);max-width:640px;text-align:center;min-height:3em;font-size:15px;max-height:30vh;overflow-y:auto}
.vbtns{display:flex;gap:12px}
.vbtns button{border:1px solid var(--line);border-radius:999px;padding:12px 22px;font-size:16px}
.vbtns .end{background:#d93025;color:#fff;border:none}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="side-top">
      <button class="ibtn" id="closeSide" title="Сховати панель"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
      <div class="grow"></div>

    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <section class="main">
    <div class="top">
      <button class="ibtn when-hidden" id="openSide" title="Чати"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
      <div class="modelpick"><span id="modelLabel">Модель</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"/></svg>
        <select id="topModel" aria-label="Модель"></select></div>
      <div class="grow"></div>
      <button class="ibtn when-hidden" id="newChat3" title="Новий чат"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>

    <div class="scroller" id="scroller"><div class="thread" id="thread"></div></div>

            accept="image/*,.pdf,.docx,.xlsx,.xls,.csv,.txt,.md,.json,.html,.htm,.xml,.srt,.vtt,.js,.ts,.py,.css,.log,.rtf,text/*">

</div>

<div class="sheet" id="sheet">
  <div class="card">
    <h2>Налаштування</h2>
    <label for="keyInput">API-ключ</label>
    <div class="inl">
      <input type="password" id="keyInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Встав ключ — моделі підтягнуться самі">

  <div class="vb"><button id="viewerShare">Поділитися / Зберегти</button><button class="ghost" id="viewerClose">Закрити</button></div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const LS = {
  get(k,d){ try{ const v=localStorage.getItem('wt_'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('wt_'+k, JSON.stringify(v)); }catch(e){} }
};
let settings = Object.assign({key:'', base:'https://api.whitetools.dev/v1', model:'', system:'', lang:'uk-UA', imgModel:'gpt-6-sol', imgSize:'1024x1024'}, LS.get('settings', {}));
let models = LS.get('models', []);

/* ================= storage (IndexedDB) ================= */
const DB = (() => {
  let dbp = null; const mem = new Map();
  function open(){
    if(dbp) return dbp;
    dbp = new Promise((res) => {
      try{
        const r = indexedDB.open('wtchat', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('chats', {keyPath:'id'});
        r.onsuccess = () => res(r.result); r.onerror = () => res(null);
      }catch(e){ res(null); }
    });
    return dbp;
  }
  async function tx(mode, fn){
    const db = await open(); if(!db) return fn(null);
    return new Promise((res, rej) => {
      const t = db.transaction('chats', mode); const s = t.objectStore('chats');
      const out = fn(s); t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => rej(t.error);
    });
  }
  return {
    async all(){ const db = await open(); if(!db) return [...mem.values()];
      return new Promise(res => { const r = db.transaction('chats').objectStore('chats').getAll(); r.onsuccess = () => res(r.result||[]); r.onerror = () => res([]); }); },
    async put(c){ const db = await open(); if(!db){ mem.set(c.id,c); return; } return tx('readwrite', s => s.put(c)); },
    async del(id){ const db = await open(); if(!db){ mem.delete(id); return; } return tx('readwrite', s => s.delete(id)); }
  };
})();

function loadScript(src){ return libs[src] || (libs[src] = new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Не вдалося завантажити бібліотеку')); document.head.appendChild(s); })); }
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFW  = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const MAMMOTH = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
const XLSXJS = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const MAX_TEXT = 120000;

function extOf(name){ const m=/\.([a-z0-9]+)$/i.exec(name||''); return m?m[1].toLowerCase():''; }
async function addFile(f){
  if(f.size > 25*1048576){ toast('Файл завеликий (макс. 25 МБ)'); return; }
  const ext = extOf(f.name);
  if(f.type.startsWith('image/') && ext!=='svg'){
    const item={kind:'image', src:'', loading:true}; pending.push(item); drawPending();
    try{ item.src = await shrink(f); }catch(e){ pending.splice(pending.indexOf(item),1); toast('Не вдалося відкрити фото'); }
    item.loading=false; drawPending(); return;
  }
  const item={kind:'file', name:f.name, ext, size:f.size, text:'', images:[], loading:true}; pending.push(item); drawPending();
  try{
    if(ext==='pdf') await readPdf(f, item);
    else if(ext==='docx') await readDocx(f, item);
    else if(ext==='xlsx' || ext==='xls') await readXlsx(f, item);
    else if(ext==='doc') throw new Error('Старий формат .doc не підтримується — збережи як .docx або PDF');
    else item.text = await f.text();
    if(item.text.length > MAX_TEXT){ item.text = item.text.slice(0,MAX_TEXT) + '\n…[текст обрізано]'; toast('Документ великий — взято перші ~120 тис. символів'); }
    if(!item.text.trim() && !item.images.length) throw new Error('У файлі не знайдено тексту');
  }catch(e){ pending.splice(pending.indexOf(item),1); toast(String(e.message||e)); }
  item.loading=false; drawPending();
}
async function readPdf(f, item){
  await loadScript(PDFJS); pdfjsLib.GlobalWorkerOptions.workerSrc = PDFW;
  const pdf = await pdfjsLib.getDocument({data: await f.arrayBuffer()}).promise;
  let out='';
  for(let p=1; p<=pdf.numPages && out.length<MAX_TEXT; p++){
    const page = await pdf.getPage(p); const tc = await page.getTextContent();
    out += `\n--- сторінка ${p} ---\n` + tc.items.map(x=>x.str + (x.hasEOL?'\n':' ')).join('');
  }
  item.text = out.trim();
  if(item.text.replace(/--- сторінка \d+ ---/g,'').trim().length < 30){   // scanned PDF -> images
    item.text = ''; const n = Math.min(pdf.numPages, 6);
    for(let p=1; p<=n; p++){
      const page = await pdf.getPage(p); const vp = page.getViewport({scale:1});
      const scale = Math.min(2, 1400/Math.max(vp.width, vp.height)); const v2 = page.getViewport({scale});
      const c=document.createElement('canvas'); c.width=v2.width; c.height=v2.height;
      await page.render({canvasContext:c.getContext('2d'), viewport:v2}).promise;
      item.images.push(c.toDataURL('image/jpeg',.8));
    }
    if(pdf.numPages>6) toast('Скан-PDF: надіслано перші 6 сторінок як зображення');
  }
}
async function readDocx(f, item){ await loadScript(MAMMOTH); const r = await mammoth.extractRawText({arrayBuffer: await f.arrayBuffer()}); item.text = r.value; }
async function readXlsx(f, item){
  await loadScript(XLSXJS); const wb = XLSX.read(await f.arrayBuffer(), {type:'array'});
  item.text = wb.SheetNames.map(n => `--- аркуш «${n}» ---\n` + XLSX.utils.sheet_to_csv(wb.Sheets[n])).join('\n\n');
}
function shrink(file, max=1600){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{ let w=img.width,h=img.height; const s=Math.min(1,max/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
      const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',.85)); };
    img.onerror=rej; img.src=url;
  });
}
function drawPending(){
  el.pending.hidden = !pending.length; el.pending.innerHTML='';
  pending.forEach((it,i)=>{
    const d=document.createElement('div'); d.className='p'+(it.loading?' busy':'');
    if(it.kind==='image') d.innerHTML = it.src ? `<img src="${it.src}">` : `<div class="chip"><div class="ic txt">…</div><div class="nm">Фото</div></div>`;
    else d.innerHTML = fileChip(it);
    const x=document.createElement('button'); x.className='x'; x.textContent='✕'; x.onclick=()=>{ pending.splice(i,1); drawPending(); updateSend(); };
    d.appendChild(x); el.pending.appendChild(d);
  });
  updateSend();
}

function updateSend(){

  el.send.innerHTML = busy ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>'
                           : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
}
el.input.addEventListener('input', ()=>{ el.input.style.height='auto'; el.input.style.height=Math.min(el.input.scrollHeight, innerHeight*.4)+'px'; updateSend(); });
el.input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey && !e.isComposing && matchMedia('(pointer:fine)').matches){ e.preventDefault(); if(!el.send.disabled && !busy) send(); } });
el.send.onclick = ()=> busy ? (controller && controller.abort()) : send();

function toApi(msgs, voice){
  const out=[]; let sys = settings.system||'';
  if(voice) sys = (sys?sys+'\n\n':'') + 'Зараз голосова розмова: відповідай коротко (1–4 речення), розмовно, без markdown, списків і емодзі. Відповідай мовою користувача.';
  if(sys) out.push({role:'system', content:sys});
  msgs.filter(m=>m.role==='user'||m.role==='assistant').forEach(m=>{
    if(m.role==='assistant'){ out.push({role:'assistant', content:(m.kind==='image' ? '[Згенеровано зображення] ' : '') + (m.text||'')}); return; }
    let text = m.text||'';
    (m.files||[]).forEach(f=>{ if(f.text) text += `\n\n[Файл: ${f.name}]\n\`\`\`\n${f.text}\n\`\`\``; else if(f.images&&f.images.length) text += `\n\n[Файл: ${f.name} — скан, сторінки додано як зображення]`; });
    const imgs = [...(m.images||[]), ...(m.files||[]).flatMap(f=>f.images||[])];
    if(imgs.length){ const parts=[{type:'text', text: text || 'Що на зображенні?'}]; imgs.forEach(u=>parts.push({type:'image_url', image_url:{url:u}})); out.push({role:'user', content:parts}); }
    else out.push({role:'user', content:text});
  });
  return out;
}

async function send(voiceText, onDelta){
  const voice = typeof voiceText === 'string';
  const text = voice ? voiceText.trim() : el.input.value.trim();
  const att = voice ? [] : pending.filter(p=>!p.loading);
  if(!text && !att.length) return '';
  if(!settings.key){ openSettings(); return ''; }
  const model = (current && current.model) || settings.model;
  if(!model){ openSettings(); return ''; }
  current.model = model;
  const userMsg = {role:'user', text, images: att.filter(a=>a.kind==='image').map(a=>a.src),
    files: att.filter(a=>a.kind==='file').map(a=>({name:a.name, ext:a.ext, size:a.size, text:a.text, images:a.images}))};
  if(imgMode && !voice) userMsg.imgReq = true;
  current.messages.push(userMsg);
  if(current.title==='Новий чат') current.title = titleFrom((imgMode&&!voice?'🎨 ':'') + (text || userMsg.files[0]?.name || 'Фото'));
  if(!voice){ pending=[]; drawPending(); el.input.value=''; el.input.style.height='auto'; }
  await persist(current);
  if(userMsg.imgReq) return generateImage(userMsg);
  return complete(voice, onDelta);
}

async function complete(voice, onDelta){
  const chat = current;
  const reply = {role:'assistant', text:''}; chat.messages.push(reply);
  renderThread();
  const nodes = el.thread.querySelectorAll('.msg.assistant .bubble'); const node = nodes[nodes.length-1];
  busy=true; updateSend(); controller=new AbortController();
  try{
    const r = await fetch(settings.base+'/chat/completions', { method:'POST', signal:controller.signal,
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+settings.key},
      body: JSON.stringify({model:chat.model, messages:toApi(chat.messages.slice(0,-1), voice), stream:true}) });
    if(!r.ok) throw new Error('HTTP '+r.status+': '+(await r.text()).slice(0,300));
    const ct = r.headers.get('content-type')||'';
    if(ct.includes('application/json')){ const j=await r.json(); reply.text = j.choices?.[0]?.message?.content || JSON.stringify(j); }
    else{
      const rd=r.body.getReader(), dec=new TextDecoder(); let buf='';
      while(true){
        const {done,value}=await rd.read(); if(done) break;
        buf+=dec.decode(value,{stream:true}); const lines=buf.split('\n'); buf=lines.pop();
        for(const line of lines){ const l=line.trim(); if(!l.startsWith('data:')) continue; const data=l.slice(5).trim(); if(data==='[DONE]') continue;
          try{ const j=JSON.parse(data); const d=j.choices?.[0]?.delta?.content ?? j.choices?.[0]?.message?.content;
            if(d){ reply.text+=d; if(chat===current){ node.innerHTML=md(reply.text)+'<span class="cursor"></span>'; scrollDown(); } if(onDelta) onDelta(reply.text); } }catch(e){} }
      }
    }
    if(!reply.text) reply.text='_(порожня відповідь)_';
  }catch(e){
    if(e.name==='AbortError'){ reply.text = (reply.text||'') + (reply.text?'\n\n':'') + '_(зупинено)_'; }
    else { chat.messages.pop(); const msg='Помилка: '+friendly(e); chat.messages.push({role:'error', text:msg}); if(voice){ finish(); throw new Error(msg); } }
  }
  finish(); return reply.text;
  function finish(){ busy=false; controller=null; updateSend(); chat.messages = chat.messages.filter((m,i,a)=> m.role!=='error' || i===a.length-1); persist(chat); if(chat===current) renderThread(); }
}
async function regenerate(){
  if(busy) return;
  while(current.messages.length && current.messages[current.messages.length-1].role!=='user') current.messages.pop();
  if(!current.messages.length) return;
  const lastU = current.messages[current.messages.length-1];
  if(lastU.imgReq) generateImage(lastU); else complete(false);
}

/* ================= image generation ================= */
let imgMode = false;
function setImgMode(on){
  imgMode = on; $('modebar').hidden = !on; $('imgBtn').classList.toggle('on', on);
  el.input.placeholder = on ? 'Опиши картинку… (можна додати фото для редагування)' : 'Запитай що завгодно';
  $('sizeSel').value = settings.imgSize || '1024x1024';
  if(on) el.input.focus();
}
$('imgBtn').onclick = ()=> setImgMode(!imgMode);
$('modeOff').onclick = ()=> setImgMode(false);
$('sizeSel').onchange = ()=>{ settings.imgSize=$('sizeSel').value; LS.set('settings', settings); };

function toJpeg(src, max=1536){
  return new Promise(res=>{ const img=new Image(); img.onload=()=>{ let w=img.width,h=img.height; const s=Math.min(1,max/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
    const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h); res(c.toDataURL('image/jpeg',.9)); }; img.onerror=()=>res(src); img.src=src; });
}
async function generateImage(userMsg){
  const chat = current;
  const reply = {role:'assistant', kind:'image', text:'', genImages:[], pending:true}; chat.messages.push(reply);
  renderThread(); scrollDown(true);
  busy=true; updateSend(); controller=new AbortController();
  try{
    // inputs: attached photos, else the last generated image in this chat (for iterative edits)
    let inputs = [...(userMsg.images||[])];
    if(!inputs.length){
      for(let i=chat.messages.length-3;i>=0;i--){ const m=chat.messages[i]; if(m.kind==='image' && m.genImages && m.genImages.length){ inputs=[await toJpeg(m.genImages[0])]; break; } if(m.role==='user' && !m.imgReq) break; }
    }
    const content = [{type:'input_text', text: userMsg.text || 'Покращ це зображення'}];
    inputs.forEach(u=>content.push({type:'input_image', image_url:u}));
    const r = await fetch(settings.base+'/responses', { method:'POST', signal:controller.signal,
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+settings.key},
      body: JSON.stringify({ model: settings.imgModel || 'gpt-6-sol',
        input:[{role:'user', content}],
        tools:[{type:'image_generation', size: settings.imgSize || '1024x1024', quality:'auto'}],
        tool_choice:{type:'image_generation'} }) });
    const t = await r.text();
    if(!r.ok) throw new Error('HTTP '+r.status+': '+t.slice(0,300));
    const j = JSON.parse(t);
    (j.output||[]).forEach(o=>{
      if(o.type==='image_generation_call' && o.result) reply.genImages.push('data:image/png;base64,'+o.result);
      if(o.type==='message') (o.content||[]).forEach(c=>{ if(c.text) reply.text += c.text; });
    });
    if(!reply.genImages.length) throw new Error(reply.text || 'Модель не повернула зображення');
    reply.text = '';
  }catch(e){
    chat.messages.pop();
    if(e.name!=='AbortError') chat.messages.push({role:'error', text:'Не вдалося створити зображення: '+friendly(e)});
  }
  delete reply.pending;
  busy=false; controller=null; updateSend(); await persist(chat); if(chat===current) renderThread();
  return '';
}

/* ---------- image viewer ---------- */
let viewerSrc='';
function openViewer(src){ viewerSrc=src; $('viewerImg').src=src; $('viewer').classList.add('open'); }
$('viewerClose').onclick=()=>$('viewer').classList.remove('open');
$('viewer').onclick=e=>{ if(e.target.id==='viewer') $('viewer').classList.remove('open'); };
$('viewerShare').onclick=async()=>{
  try{
    const blob = await (await fetch(viewerSrc)).blob();
    const file = new File([blob], 'wt-image-'+Date.now()+'.png', {type:blob.type||'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return; }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=file.name; document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ if(e.name!=='AbortError') toast('Утримуй картинку, щоб зберегти'); }
};

/* ---------- expose for voice ---------- */
window.WT = { send:(t,cb)=>send(t,cb), settings:()=>settings, abort:()=>{ if(controller) controller.abort(); }, openSettings, ready:()=>!!(settings.key && ((current&&current.model)||settings.model)) };

/* ---------- boot ---------- */
(async ()=>{
  await loadAll();
  const last = chats.sort((a,b)=>b.updated-a.updated)[0];
  current = newChatObj(); current.model = settings.model;
  renderList(); renderThread(); updateSend();
  if(!settings.key) openSettings();
})();
})();

/* ================= VOICE MODE ================= */
(() => {
  const $ = id => document.getElementById(id);
  const ui = { box:$('voice'), orb:$('orb'), status:$('vstatus'), text:$('vtext'), mute:$('vmute'), end:$('vend') };
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const synth = window.speechSynthesis;
  let active=false, paused=false, state='idle', rec=null, spokenUpTo=0, queue=[], speakingNow=false, replyDone=false;
  function setState(s, msg){ state=s; ui.orb.className='orb '+s;
    ui.status.textContent = msg || {listening:'Слухаю…', thinking:'Думаю…', speaking:'Говорю…', idle:'Пауза — торкнись кола'}[s] || ''; }
  const lang = () => (WT.settings().lang || 'uk-UA');
  function pickVoice(){ const l=lang().toLowerCase(), base=l.split('-')[0]; const vs=synth?synth.getVoices():[];
    return vs.find(v=>v.lang.toLowerCase()===l && /enhanced|premium|siri|покращ/i.test(v.name)) || vs.find(v=>v.lang.toLowerCase()===l) || vs.find(v=>v.lang.toLowerCase().startsWith(base)) || null; }
  function clean(t){ return t.replace(/```[\s\S]*?```/g,' ').replace(/`([^`]*)`/g,'$1').replace(/[*_#>~|]/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu,'').replace(/\s+/g,' ').trim(); }
  function enqueueFrom(full, final){
    while(true){ const rest=full.slice(spokenUpTo); if(!rest) break; let len;
      if(final) len=rest.length; else { const m=rest.match(/^[\s\S]*?[.!?…:;\n](?=\s)/); if(!m) break; len=m[0].length; }
      const c=clean(rest.slice(0,len)); spokenUpTo+=len; if(c) queue.push(c); if(final) break; }
    pump();
  }
  function pump(){
    if(!active || speakingNow) return;
    if(!queue.length){ if(replyDone && state!=='listening') afterSpeech(); return; }
    const u=new SpeechSynthesisUtterance(queue.shift()); u.lang=lang(); const v=pickVoice(); if(v) u.voice=v; u.rate=1.05;
    speakingNow=true; setState('speaking'); u.onend=u.onerror=()=>{ speakingNow=false; pump(); }; synth.speak(u);
  }
  function afterSpeech(){ if(active && !paused) listen(); else setState('idle'); }
  function stopSpeaking(){ queue=[]; speakingNow=false; try{ synth.cancel(); }catch(e){} }
  function listen(){
    if(!active || paused) return;
    if(!SR){ setState('idle','Розпізнавання мови не підтримується в цьому браузері'); return; }
    try{ rec && rec.abort(); }catch(e){}
    rec=new SR(); rec.lang=lang(); rec.interimResults=true; rec.continuous=false; rec.maxAlternatives=1;
    let finalText='', got=false;
    rec.onresult=e=>{ let interim=''; finalText=''; for(const r of e.results){ if(r.isFinal) finalText+=r[0].transcript; else interim+=r[0].transcript; } got=true; ui.text.textContent=(finalText+interim)||'…'; };
    rec.onerror=e=>{ if(e.error==='not-allowed'||e.error==='service-not-allowed'){ paused=true; setState('idle','Немає доступу до мікрофона. Дозволь мікрофон у налаштуваннях Safari й увімкни Диктування.'); } };
    rec.onend=async()=>{ if(!active||paused||state!=='listening') return; const t=finalText.trim()||(got?ui.text.textContent.trim():''); if(!t||t==='…'){ listen(); return; } await ask(t); };
    setState('listening'); ui.text.textContent='Говори…'; try{ rec.start(); }catch(e){ setTimeout(listen,400); }
  }
  async function ask(t){
    setState('thinking'); ui.text.textContent=t; spokenUpTo=0; queue=[]; replyDone=false;
    try{ const full=await WT.send(t, txt=>{ if(active) enqueueFrom(txt,false); }); replyDone=true; if(!active) return; enqueueFrom(full||'', true); }
    catch(e){ replyDone=true; paused=true; setState('idle','Помилка'); ui.text.textContent=String(e.message||e); }
  }
  function unlock(){ try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; synth.speak(u); }catch(e){} }
  $('voiceBtn').onclick=()=>{ if(!WT.ready()){ WT.openSettings(); return; } active=true; paused=false; ui.box.classList.add('open'); unlock(); listen(); };
  ui.orb.onclick=()=>{ if(state==='speaking'||state==='thinking'){ WT.abort(); stopSpeaking(); replyDone=true; paused=false; listen(); }
    else if(state==='idle'){ paused=false; listen(); } else if(state==='listening'){ try{ rec.stop(); }catch(e){} } };
  ui.mute.onclick=()=>{ paused=!paused; ui.mute.textContent=paused?'▶︎ Продовжити':'⏸ Пауза'; if(paused){ try{ rec&&rec.abort(); }catch(e){} stopSpeaking(); setState('idle'); } else listen(); };
  ui.end.onclick=()=>{ active=false; paused=false; ui.mute.textContent='⏸ Пауза'; try{ rec&&rec.abort(); }catch(e){} stopSpeaking(); WT.abort(); ui.box.classList.remove('open'); setState('idle'); };
})();
</script>
