<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WT Chat">
<meta name="theme-color" content="#f6f5f2">
<title>WT Chat</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23161616'/%3E%3Ctext x='90' y='112' font-family='Helvetica,Arial' font-size='72' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EWT%3C/text%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root{
    --bg:#f6f5f2; --panel:#ffffff; --ink:#1b1b1a; --muted:#77736c; --line:#e4e1da;
    --accent:#1b1b1a; --user:#e9e6df; --err:#b3261e; --ok:#2e7d32;
    --r:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141414; --panel:#1e1e1e; --ink:#ecebe8; --muted:#9a968f; --line:#2e2e2e;
      --accent:#ecebe8; --user:#2a2a2a; --err:#ff8a80; --ok:#81c784; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif}
  body{display:flex;flex-direction:column;height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
  header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
  header .title{font-weight:650;font-size:17px}
  header .model{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
  header .spacer{flex:1}
  button{font:inherit;color:inherit;cursor:pointer}
  .iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:14px}
  main{flex:1;overflow-y:auto;padding:16px 14px 8px;-webkit-overflow-scrolling:touch}
  .wrap{max-width:820px;margin:0 auto}
  .msg{margin:0 0 14px;display:flex}
  .msg.user{justify-content:flex-end}
  .bubble{max-width:88%;padding:10px 14px;border-radius:var(--r);word-wrap:break-word;overflow-wrap:anywhere}
  .msg.user .bubble{background:var(--user);white-space:pre-wrap}
  .msg.assistant .bubble{background:transparent;padding-left:2px;max-width:100%}
  .msg.error .bubble{color:var(--err);border:1px solid var(--err);background:transparent;font-size:14px}
  .bubble img.att{display:block;max-width:220px;max-height:220px;border-radius:10px;margin:0 0 6px auto}
  .bubble pre{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;font-size:13px}
  .bubble code{font-family:ui-monospace,Menlo,monospace;font-size:.9em}
  .bubble p{margin:.4em 0}
  .bubble table{border-collapse:collapse} .bubble td,.bubble th{border:1px solid var(--line);padding:4px 8px}
  .empty{color:var(--muted);text-align:center;margin-top:18vh;font-size:15px}
  .typing{color:var(--muted)}
  footer{border-top:1px solid var(--line);background:var(--bg);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;max-width:820px;margin:0 auto 6px}
  .thumb{position:relative}
  .thumb img{width:56px;height:56px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .thumb button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:none;background:var(--ink);color:var(--bg);font-size:13px;line-height:22px;padding:0}
  .composer{display:flex;align-items:flex-end;gap:8px;max-width:820px;margin:0 auto}
  .composer textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    border-radius:20px;padding:10px 14px;font:inherit;max-height:40vh;min-height:44px}
  .round{width:44px;height:44px;flex:0 0 44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:20px;display:flex;align-items:center;justify-content:center}
  .send{background:var(--accent);color:var(--bg);border:none}
  .send:disabled{opacity:.35}
  /* settings sheet */
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .sheet.open{display:flex}
  .card{background:var(--panel);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92dvh;overflow-y:auto}
  @media (min-width:700px){ .sheet{align-items:center} .card{border-radius:18px} }
  .card h2{margin:0 0 12px;font-size:19px}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
  input[type=text],input[type=password],select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  .row{display:flex;gap:8px;align-items:center}
  .row > *{flex:1}
  .status{font-size:13px;margin-top:6px;min-height:1.2em}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .actions{display:flex;gap:8px;margin-top:18px}
  .primary{flex:1;background:var(--accent);color:var(--bg);border:none;border-radius:12px;padding:12px;font-weight:600}
  .secondary{flex:1;background:transparent;border:1px solid var(--line);border-radius:12px;padding:12px}
  .hint{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.45}
  /* voice mode */
  .voice{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:28px;
    padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}
  .voice.open{display:flex}
  .orb{width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8fb8ff,#3b5bdb 60%,#1c2c7a);
    box-shadow:0 0 0 0 rgba(59,91,219,.45);transition:transform .25s;border:none}
  .orb.listening{animation:pulse 1.4s infinite}
  .orb.thinking{animation:spin 1.2s linear infinite;background:conic-gradient(#3b5bdb,#8fb8ff,#3b5bdb)}
  .orb.speaking{animation:talk .5s ease-in-out infinite alternate}
  .orb.idle{opacity:.55}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(59,91,219,.45)}70%{box-shadow:0 0 0 34px rgba(59,91,219,0)}100%{box-shadow:0 0 0 0 rgba(59,91,219,0)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes talk{from{transform:scale(.94)}to{transform:scale(1.06)}}
  .vstatus{font-size:19px;font-weight:600}
  .vtext{color:var(--muted);max-width:640px;text-align:center;min-height:3em;font-size:15px;max-height:30vh;overflow-y:auto}
  .vbtns{display:flex;gap:12px}
  .vbtns button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:12px 22px;font-size:16px}
  .vbtns .end{background:#d93025;color:#fff;border:none}
</style>
</head>
<body>
<header>
  <div>
    <div class="title">WT Chat</div>
    <div class="model" id="modelLabel">модель не вибрана</div>
  </div>
  <div class="spacer"></div>
  <button class="iconbtn" id="voiceBtn" title="Голосова розмова">🎙 Голос</button>
  <button class="iconbtn" id="newChat" title="Новий чат">＋ Новий</button>
  <button class="iconbtn" id="openSettings" title="Налаштування">⚙︎</button>
</header>

<main id="scroller"><div class="wrap" id="messages"></div></main>

<footer>
  <div class="thumbs" id="thumbs"></div>
  <div class="composer">
    <button class="round" id="attachBtn" title="Додати фото">＋</button>
    <input type="file" id="fileInput" accept="image/*" multiple hidden>
    <textarea id="input" rows="1" placeholder="Повідомлення… (🎤 на клавіатурі для голосу)"></textarea>
    <button class="round send" id="sendBtn" title="Надіслати" disabled>↑</button>
  </div>
</footer>

<div class="sheet" id="sheet">
  <div class="card">
    <h2>Налаштування</h2>
    <label for="keyInput">API-ключ</label>
    <input type="password" id="keyInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Встав ключ — моделі підтягнуться самі">
    <div class="row" style="margin-top:6px">
      <button class="secondary" id="toggleKey" style="flex:0 0 auto;padding:8px 12px">Показати</button>
      <div></div>
    </div>

    <label for="baseInput">Адреса API (Base URL)</label>
    <input type="text" id="baseInput" autocapitalize="off" spellcheck="false" value="https://api.whitetools.dev/v1">

    <label for="modelSelect">Модель</label>
    <div class="row">
      <select id="modelSelect"><option value="">— спершу встав ключ —</option></select>
      <button class="secondary" id="reloadModels" style="flex:0 0 auto;padding:10px 12px">↻</button>
    </div>
    <div class="status" id="modelStatus"></div>

    <label for="langSelect">Мова голосу</label>
    <select id="langSelect">
      <option value="uk-UA">Українська</option>
      <option value="en-US">English</option>
      <option value="es-ES">Español</option>
      <option value="ru-RU">Русский</option>
    </select>

    <label for="sysInput">Системний промпт (необов'язково)</label>
    <input type="text" id="sysInput" placeholder="Напр.: Відповідай українською, коротко">

    <div class="actions">
      <button class="secondary" id="closeSettings">Закрити</button>
      <button class="primary" id="saveSettings">Зберегти</button>
    </div>
    <p class="hint">Ключ зберігається тільки в цьому браузері на цьому пристрої й нікуди, крім адреси API, не надсилається. Для голосу натисни 🎤 на клавіатурі iPhone/iPad.</p>
  </div>
</div>

<div class="voice" id="voice">
  <div class="vstatus" id="vstatus">Голосова розмова</div>
  <button class="orb idle" id="orb" aria-label="Говорити / перебити"></button>
  <div class="vtext" id="vtext">Натисни на коло й говори</div>
  <div class="vbtns">
    <button id="vmute">⏸ Пауза</button>
    <button class="end" id="vend">Завершити</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d){ try{ const v = localStorage.getItem('wt_'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
    set(k, v){ try{ localStorage.setItem('wt_'+k, JSON.stringify(v)); }catch(e){} }
  };

  let settings = Object.assign({key:'', base:'https://api.whitetools.dev/v1', model:'', system:'', lang:'uk-UA'}, store.get('settings', {}));
  let history = store.get('history', []);   // [{role, text, images:[dataURL]}]
  let pending = [];                         // images waiting to send
  let busy = false;
  let controller = null;

  const els = {
    messages:$('messages'), scroller:$('scroller'), input:$('input'), send:$('sendBtn'),
    thumbs:$('thumbs'), file:$('fileInput'), sheet:$('sheet'), key:$('keyInput'),
    base:$('baseInput'), modelSel:$('modelSelect'), modelStatus:$('modelStatus'),
    sys:$('sysInput'), modelLabel:$('modelLabel'), lang:$('langSelect')
  };

  const baseUrl = () => (els.base.value || settings.base || '').trim().replace(/\/+$/,'');

  function md(text){
    try{ return DOMPurify.sanitize(marked.parse(text||'')); }
    catch(e){ const d=document.createElement('div'); d.textContent=text; return d.innerHTML; }
  }

  function render(){
    els.messages.innerHTML = '';
    if(!history.length){
      const e = document.createElement('div'); e.className='empty';
      e.textContent = settings.key ? 'Напиши щось або додай фото' : 'Відкрий ⚙︎ і встав свій API-ключ';
      els.messages.appendChild(e);
    }
    history.forEach(m => els.messages.appendChild(bubble(m)));
    els.modelLabel.textContent = settings.model || 'модель не вибрана';
    scrollDown();
  }

  function bubble(m){
    const row = document.createElement('div'); row.className = 'msg ' + m.role;
    const b = document.createElement('div'); b.className = 'bubble';
    if(m.role==='user'){
      (m.images||[]).forEach(src => { const i=document.createElement('img'); i.className='att'; i.src=src; b.appendChild(i); });
      if(m.text){ const t=document.createElement('div'); t.textContent=m.text; b.appendChild(t); }
    } else if(m.role==='error'){
      b.textContent = m.text;
    } else {
      b.innerHTML = md(m.text);
    }
    row.appendChild(b); return row;
  }

  function scrollDown(){ requestAnimationFrame(()=>{ els.scroller.scrollTop = els.scroller.scrollHeight; }); }
  function save(){ store.set('history', history.slice(-60)); }

  function updateSend(){ els.send.disabled = busy ? false : !(els.input.value.trim() || pending.length); els.send.textContent = busy ? '■' : '↑'; }

  // ---------- models ----------
  let loadTimer = null;
  async function loadModels(){
    const key = els.key.value.trim();
    if(!key){ els.modelStatus.textContent=''; return; }
    els.modelStatus.className='status'; els.modelStatus.textContent='Завантажую моделі…';
    try{
      const r = await fetch(baseUrl()+'/models', {headers:{'Authorization':'Bearer '+key}});
      const txt = await r.text();
      if(!r.ok) throw new Error('HTTP '+r.status+': '+txt.slice(0,200));
      const j = JSON.parse(txt);
      const list = (j.data || j.models || j || []).map(x => typeof x==='string'?x:(x.id||x.name)).filter(Boolean).sort();
      if(!list.length) throw new Error('Список моделей порожній');
      const keep = settings.model && list.includes(settings.model) ? settings.model : list[0];
      els.modelSel.innerHTML = list.map(id => `<option value="${id.replace(/"/g,'&quot;')}">${id}</option>`).join('');
      els.modelSel.value = keep;
      els.modelStatus.className='status ok'; els.modelStatus.textContent = '✓ Ключ працює, моделей: '+list.length;
    }catch(e){
      els.modelStatus.className='status err';
      els.modelStatus.textContent = friendly(e);
    }
  }
  els.key.addEventListener('input', ()=>{ clearTimeout(loadTimer); loadTimer=setTimeout(loadModels, 500); });
  els.key.addEventListener('paste', ()=>{ clearTimeout(loadTimer); loadTimer=setTimeout(loadModels, 150); });
  els.base.addEventListener('change', loadModels);
  $('reloadModels').onclick = loadModels;

  function friendly(e){
    const m = String(e && e.message || e);
    if(/Failed to fetch|Load failed|NetworkError/i.test(m))
      return 'Не вдалося з\'єднатися з API. Перевір інтернет і адресу. Якщо все правильно — сервер блокує запити з браузера (CORS), тоді потрібен посередник.';
    if(/401|403/.test(m)) return 'Ключ не прийнято ('+m.slice(0,120)+')';
    return m;
  }

  // ---------- settings sheet ----------
  function openSettings(){
    els.key.value = settings.key; els.base.value = settings.base; els.sys.value = settings.system || ''; els.lang.value = settings.lang || 'uk-UA';
    if(settings.model){ els.modelSel.innerHTML = `<option>${settings.model}</option>`; }
    els.sheet.classList.add('open');
    if(settings.key) loadModels();
  }
  $('openSettings').onclick = openSettings;
  $('closeSettings').onclick = ()=> els.sheet.classList.remove('open');
  els.sheet.addEventListener('click', e=>{ if(e.target===els.sheet) els.sheet.classList.remove('open'); });
  $('toggleKey').onclick = ()=>{ const p = els.key.type==='password'; els.key.type = p?'text':'password'; $('toggleKey').textContent = p?'Сховати':'Показати'; };
  $('saveSettings').onclick = ()=>{
    settings = { key: els.key.value.trim(), base: baseUrl(), model: els.modelSel.value, system: els.sys.value.trim(), lang: els.lang.value };
    store.set('settings', settings); els.sheet.classList.remove('open'); render();
  };

  $('newChat').onclick = ()=>{ if(busy && controller) controller.abort(); history=[]; save(); render(); };

  // ---------- images ----------
  $('attachBtn').onclick = ()=> els.file.click();
  els.file.onchange = async ()=>{
    for(const f of els.file.files){ try{ pending.push(await shrink(f)); }catch(e){} }
    els.file.value=''; drawThumbs(); updateSend();
  };
  function shrink(file, max=1600){
    return new Promise((res, rej)=>{
      const url = URL.createObjectURL(file); const img = new Image();
      img.onload = ()=>{
        let {width:w, height:h} = img; const s = Math.min(1, max/Math.max(w,h));
        w=Math.round(w*s); h=Math.round(h*s);
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg', .85));
      };
      img.onerror = rej; img.src = url;
    });
  }
  function drawThumbs(){
    els.thumbs.innerHTML='';
    pending.forEach((src,i)=>{
      const d=document.createElement('div'); d.className='thumb';
      d.innerHTML=`<img src="${src}"><button aria-label="Прибрати">✕</button>`;
      d.querySelector('button').onclick=()=>{ pending.splice(i,1); drawThumbs(); updateSend(); };
      els.thumbs.appendChild(d);
    });
  }

  // ---------- input ----------
  els.input.addEventListener('input', ()=>{ els.input.style.height='auto'; els.input.style.height=Math.min(els.input.scrollHeight, innerHeight*.4)+'px'; updateSend(); });
  els.input.addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.shiftKey && !e.isComposing && matchMedia('(pointer:fine)').matches){ e.preventDefault(); send(); }
  });
  els.send.onclick = ()=> busy ? (controller && controller.abort()) : send();
  window.__wtSend = send;
  window.__wtSettings = ()=>settings;
  window.__wtAbort = ()=>{ if(controller) controller.abort(); };
  window.__wtOpenSettings = openSettings;

  // ---------- chat ----------
  function toApi(voice){
    const msgs = [];
    let sys = settings.system || '';
    if(voice) sys = (sys ? sys+'\n\n' : '') + 'Зараз голосова розмова: відповідай коротко (1–4 речення), розмовно, без markdown, списків і емодзі. Відповідай мовою користувача.';
    if(sys) msgs.push({role:'system', content:sys});
    history.filter(m=>m.role==='user'||m.role==='assistant').forEach(m=>{
      if(m.role==='user' && m.images && m.images.length){
        const parts = m.images.map(u=>({type:'image_url', image_url:{url:u}}));
        if(m.text) parts.unshift({type:'text', text:m.text});
        msgs.push({role:'user', content:parts});
      } else msgs.push({role:m.role, content:m.text||''});
    });
    return msgs;
  }

  async function send(voiceText, onDelta){
    const voice = typeof voiceText === 'string';
    const text = voice ? voiceText.trim() : els.input.value.trim();
    if(!text && !pending.length) return '';
    if(!settings.key || !settings.model){ openSettings(); return ''; }

    history.push({role:'user', text, images:pending.slice()});
    pending=[]; drawThumbs(); els.input.value=''; els.input.style.height='auto';
    const reply = {role:'assistant', text:''}; history.push(reply);
    render();
    const nodes = els.messages.querySelectorAll('.msg.assistant .bubble');
    const node = nodes[nodes.length-1]; node.innerHTML='<span class="typing">…</span>';

    busy=true; updateSend(); controller = new AbortController();
    try{
      const r = await fetch(settings.base+'/chat/completions', {
        method:'POST', signal:controller.signal,
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+settings.key},
        body: JSON.stringify({model:settings.model, messages:toApi(voice).slice(0,-1), stream:true})
      });
      if(!r.ok){ throw new Error('HTTP '+r.status+': '+(await r.text()).slice(0,300)); }
      const ct = r.headers.get('content-type')||'';
      if(ct.includes('application/json')){
        const j = await r.json();
        reply.text = j.choices?.[0]?.message?.content || JSON.stringify(j);
      } else {
        const reader = r.body.getReader(); const dec = new TextDecoder(); let buf='';
        while(true){
          const {done, value} = await reader.read(); if(done) break;
          buf += dec.decode(value, {stream:true});
          const lines = buf.split('\n'); buf = lines.pop();
          for(const line of lines){
            const l=line.trim(); if(!l.startsWith('data:')) continue;
            const data=l.slice(5).trim(); if(data==='[DONE]') continue;
            try{ const j=JSON.parse(data); const d=j.choices?.[0]?.delta?.content ?? j.choices?.[0]?.message?.content; if(d){ reply.text+=d; node.innerHTML=md(reply.text); scrollDown(); if(onDelta) onDelta(reply.text); } }catch(e){}
          }
        }
      }
      if(!reply.text) reply.text='_(порожня відповідь)_';
      node.innerHTML = md(reply.text);
    }catch(e){
      if(e.name==='AbortError'){ reply.text = (reply.text||'') + '\n\n_(зупинено)_'; node.innerHTML=md(reply.text); }
      else { history.pop(); const msg='Помилка: '+friendly(e); history.push({role:'error', text:msg}); render(); if(voice) throw new Error(msg); }
    }finally{
      busy=false; controller=null; updateSend(); save(); scrollDown();
    }
    return reply.text;
  }

  render(); updateSend();
  if(!settings.key) openSettings();
})();

/* ================= VOICE MODE ================= */
(() => {
  const $ = id => document.getElementById(id);
  const ui = { box:$('voice'), orb:$('orb'), status:$('vstatus'), text:$('vtext'), mute:$('vmute'), end:$('vend') };
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const synth = window.speechSynthesis;
  let active=false, paused=false, state='idle', rec=null, spokenUpTo=0, queue=[], speakingNow=false, replyDone=false;

  function setState(s, msg){
    state=s; ui.orb.className='orb '+s;
    ui.status.textContent = msg || {listening:'Слухаю…', thinking:'Думаю…', speaking:'Говорю…', idle:'Пауза — торкнись кола'}[s] || '';
  }
  const lang = () => (window.__wtSettings().lang || 'uk-UA');

  function pickVoice(){
    const l = lang().toLowerCase(), base = l.split('-')[0];
    const vs = synth ? synth.getVoices() : [];
    return vs.find(v=>v.lang.toLowerCase()===l && /enhanced|premium|siri/i.test(v.name))
        || vs.find(v=>v.lang.toLowerCase()===l)
        || vs.find(v=>v.lang.toLowerCase().startsWith(base)) || null;
  }
  function clean(t){
    return t.replace(/```[\s\S]*?```/g,' ').replace(/`([^`]*)`/g,'$1').replace(/[*_#>~|]/g,'')
            .replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu,'').replace(/\s+/g,' ').trim();
  }

  // ---- speaking, sentence by sentence while the reply streams ----
  function enqueueFrom(full, final){
    while(true){
      const rest = full.slice(spokenUpTo);
      if(!rest) break;
      let len;
      if(final) len = rest.length;
      else { const m = rest.match(/^[\s\S]*?[.!?…:;\n](?=\s)/); if(!m) break; len = m[0].length; }
      const c = clean(rest.slice(0,len)); spokenUpTo += len; if(c) queue.push(c);
      if(final) break;
    }
    pump();
  }
  function pump(){
    if(!active || speakingNow) return;
    if(!queue.length){ if(replyDone && state!=='listening') afterSpeech(); return; }
    const u = new SpeechSynthesisUtterance(queue.shift());
    u.lang = lang(); const v = pickVoice(); if(v) u.voice = v; u.rate = 1.05;
    speakingNow = true; setState('speaking');
    u.onend = u.onerror = () => { speakingNow=false; pump(); };
    synth.speak(u);
  }
  function afterSpeech(){ if(active && !paused) listen(); else setState('idle'); }
  function stopSpeaking(){ queue=[]; speakingNow=false; try{ synth.cancel(); }catch(e){} }

  // ---- listening ----
  function listen(){
    if(!active || paused) return;
    if(!SR){ setState('idle','Розпізнавання мови не підтримується в цьому браузері'); return; }
    try{ rec && rec.abort(); }catch(e){}
    rec = new SR(); rec.lang = lang(); rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
    let finalText='', gotSomething=false;
    rec.onresult = e => {
      let interim=''; finalText='';
      for(const r of e.results){ if(r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript; }
      gotSomething = true; ui.text.textContent = (finalText+interim) || '…';
    };
    rec.onerror = e => {
      if(e.error==='not-allowed' || e.error==='service-not-allowed'){ paused=true; setState('idle','Немає доступу до мікрофона. Дозволь мікрофон для цього сайту в налаштуваннях Safari.'); }
    };
    rec.onend = async () => {
      if(!active || paused || state!=='listening') return;
      const t = finalText.trim() || (gotSomething ? ui.text.textContent.trim() : '');
      if(!t || t==='…'){ listen(); return; }   // silence: keep listening
      await ask(t);
    };
    setState('listening'); ui.text.textContent='Говори…';
    try{ rec.start(); }catch(e){ setTimeout(listen, 400); }
  }

  async function ask(t){
    setState('thinking'); ui.text.textContent = t;
    spokenUpTo=0; queue=[]; replyDone=false;
    try{
      const full = await window.__wtSend(t, txt => { if(active) enqueueFrom(txt, false); });
      replyDone = true;
      if(!active) return;
      enqueueFrom(full || '', true);
    }catch(e){
      replyDone = true; setState('idle', 'Помилка'); ui.text.textContent = String(e.message||e); paused = true;
    }
  }

  // ---- controls ----
  function unlockAudio(){ try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; synth.speak(u); }catch(e){} }
  $('voiceBtn').onclick = () => {
    const s = window.__wtSettings();
    if(!s.key || !s.model){ window.__wtOpenSettings(); return; }
    active=true; paused=false; ui.box.classList.add('open'); unlockAudio();
    if(synth && !synth.getVoices().length) synth.onvoiceschanged = ()=>{};
    listen();
  };
  ui.orb.onclick = () => {
    if(state==='speaking' || state==='thinking'){ window.__wtAbort(); stopSpeaking(); replyDone=true; paused=false; listen(); }
    else if(state==='idle'){ paused=false; listen(); }
    else if(state==='listening'){ try{ rec.stop(); }catch(e){} }   // finish phrase now
  };
  ui.mute.onclick = () => {
    paused = !paused; ui.mute.textContent = paused ? '▶︎ Продовжити' : '⏸ Пауза';
    if(paused){ try{ rec && rec.abort(); }catch(e){} stopSpeaking(); setState('idle'); } else listen();
  };
  ui.end.onclick = () => {
    active=false; paused=false; ui.mute.textContent='⏸ Пауза';
    try{ rec && rec.abort(); }catch(e){} stopSpeaking(); window.__wtAbort();
    ui.box.classList.remove('open'); setState('idle');
  };
})();
</script>
</body>
</html>
